services:
  bord-food-api:
    image: ghcr.io/callum-baillie/bord-food-api:latest
    container_name: bord-food-api
    restart: unless-stopped
    user: "99:100"
    ports:
      - "${HOST_PORT:-8081}:8080"
    environment:
      API_KEY: ${API_KEY:-}
      DATASETS: ${DATASETS:-branded,foundation,fndds,sr_legacy}
      AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-true}
    volumes:
      - /mnt/user/appdata/bord-food-api:/data
      - /mnt/user/appdata/bord-food-api/imports:/imports:ro
