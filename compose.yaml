services:
  bord-food-api:
    build: .
    image: bord-food-api:local
    container_name: bord-food-api
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8081}:8080"
    environment:
      API_KEY: ${API_KEY:-}
      DATASETS: ${DATASETS:-branded,foundation,fndds,sr_legacy}
      AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-true}
      BORD_FOOD_CONFIG: ${BORD_FOOD_CONFIG:-}
    volumes:
      - food-data:/data
      - ./imports:/imports:ro

  bord-food-worker:
    build: .
    image: bord-food-api:local
    container_name: bord-food-worker
    command: ["worker"]
    restart: unless-stopped
    environment:
      DATASETS: ${DATASETS:-branded,foundation,fndds,sr_legacy}
      AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-true}
      BORD_FOOD_CONFIG: ${BORD_FOOD_CONFIG:-}
    volumes:
      - food-data:/data
      - ./imports:/imports:ro
    healthcheck:
      test: ["CMD", "python", "-m", "bord_food_api", "worker-health"]
      interval: 60s
      timeout: 5s
      start_period: 30m
      retries: 3

volumes:
  food-data:
