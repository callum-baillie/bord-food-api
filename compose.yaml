services:
  bord-food-api:
    build: .
    image: bord-food-api:local
    container_name: bord-food-api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8081}:8080"
    environment:
      API_KEY: ${API_KEY:-}
      DATASETS: ${DATASETS:-branded,foundation,fndds,sr_legacy}
      AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-true}
    volumes:
      - food-data:/data
      - ./imports:/imports:ro

volumes:
  food-data:
